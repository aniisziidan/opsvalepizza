services:
  postgres:
    image: postgres:16-alpine
    container_name: opsvale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsvale
      POSTGRES_PASSWORD: opsvale
      POSTGRES_DB: opsvale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
