name: Build & Push Image

# Builds the production Docker image on GitHub's runners and pushes it to the
# GitHub Container Registry (GHCR). The VPS then only pulls the finished image
# (see deploy.sh) — it never runs `npm ci` / `next build` itself.
#
# The image is published to: ghcr.io/aniisziidan/opsvalepizza
# Tags: `latest` (moving) + the exact commit SHA (immutable, for rollback).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/aniisziidan/opsvalepizza

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on the VPS with: \`bash deploy.sh\`" >> "$GITHUB_STEP_SUMMARY"
