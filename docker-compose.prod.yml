services:
  app:
    # Image is built & pushed by GitHub Actions (.github/workflows/deploy.yml).
    # The VPS pulls this finished image instead of building locally.
    # Override IMAGE_TAG to pin/roll back to a specific commit SHA.
    image: ghcr.io/aniisziidan/opsvalepizza:${IMAGE_TAG:-latest}
    container_name: opsvale-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-opsvale}:${POSTGRES_PASSWORD:-opsvale}@postgres:5432/${POSTGRES_DB:-opsvale}?schema=public
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - opsvale-network
    volumes:
      - uploads_data:/app/uploads

  # Reverse proxy / TLS termination. Opt-in: only starts when the `proxy` profile is enabled
  # (`docker compose --profile proxy up -d`). Omit it if TLS is terminated by a host-level proxy.
  caddy:
    image: caddy:2-alpine
    container_name: opsvale-caddy
    restart: unless-stopped
    profiles: [proxy]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-opsvale.eu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - opsvale-network

  postgres:
    image: postgres:16-alpine
    container_name: opsvale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsvale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsvale}
      POSTGRES_DB: ${POSTGRES_DB:-opsvale}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsvale}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsvale-network

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  opsvale-network:
    driver: bridge
